version: "3.9"

# ── Farfetch Compliance Alert System — full stack ────────────────────────────
# Usage:
#   docker compose up --build          # first run (builds image + seeds DB)
#   docker compose up                  # subsequent runs
#   docker compose down -v             # stop + wipe Neo4j data volumes
#
# Override credentials via a .env file in this directory:
#   NEO4J_PASSWORD=mysecret

services:

  # ── Neo4j Community (graph database) ────────────────────────────────────────
  neo4j:
    image: neo4j:5.15-community
    container_name: farfetch-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-farfetch123}"
      NEO4J_PLUGINS: "[]"
      NEO4J_dbms_memory_pagecache_size: "256M"
      NEO4J_dbms_memory_heap_max__size: "512M"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--quiet"
        - "--tries=1"
        - "--spider"
        - "http://localhost:7474"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ── Streamlit app ────────────────────────────────────────────────────────────
  app:
    build: .
    container_name: farfetch-app
    ports:
      - "${PORT:-8501}:8501"
    environment:
      NEO4J_URI:      "bolt://neo4j:7687"
      NEO4J_USER:     "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-farfetch123}"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

# ── Named volumes (data persists across `docker compose up/down`) ────────────
volumes:
  neo4j_data:
  neo4j_logs:
