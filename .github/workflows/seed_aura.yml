name: Seed Neo4j Aura

# Run manually from the GitHub Actions tab (Actions → Seed Neo4j Aura → Run workflow)
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets are set
        env:
          NEO4J_URI:      ${{ secrets.NEO4J_URI }}
          NEO4J_USER:     ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python - <<'EOF'
          import os
          uri = os.getenv("NEO4J_URI", "")
          user = os.getenv("NEO4J_USER", "")
          pwd  = os.getenv("NEO4J_PASSWORD", "")
          print(f"NEO4J_URI    set={bool(uri):<5} length={len(uri)}  scheme={'OK' if '://' in uri else 'MISSING ://'}")
          print(f"NEO4J_USER   set={bool(user):<5} length={len(user)}")
          print(f"NEO4J_PASSWORD set={bool(pwd):<5} length={len(pwd)}")
          if not uri or "://" not in uri:
              raise SystemExit("ERROR: NEO4J_URI secret is empty or missing the scheme (neo4j+s://...)")
          EOF

      - name: Run seed.py
        env:
          NEO4J_URI:      ${{ secrets.NEO4J_URI }}
          NEO4J_USER:     ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: python seed.py

      - name: Run generate_dataset.py
        env:
          NEO4J_URI:      ${{ secrets.NEO4J_URI }}
          NEO4J_USER:     ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: python generate_dataset.py
