name: Seed Neo4j Aura

# Run manually — type your Aura credentials into the input boxes when you click Run workflow
on:
  workflow_dispatch:
    inputs:
      neo4j_uri:
        description: 'Neo4j Aura URI  (e.g. neo4j+s://xxxx.databases.neo4j.io)'
        required: true
      neo4j_user:
        description: 'Neo4j username'
        required: true
        default: '26a71ac2'
      neo4j_password:
        description: 'Neo4j password'
        required: true

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run seed.py
        env:
          NEO4J_URI:      ${{ github.event.inputs.neo4j_uri }}
          NEO4J_USER:     ${{ github.event.inputs.neo4j_user }}
          NEO4J_PASSWORD: ${{ github.event.inputs.neo4j_password }}
        run: python seed.py

      - name: Run generate_dataset.py
        env:
          NEO4J_URI:      ${{ github.event.inputs.neo4j_uri }}
          NEO4J_USER:     ${{ github.event.inputs.neo4j_user }}
          NEO4J_PASSWORD: ${{ github.event.inputs.neo4j_password }}
        run: python generate_dataset.py
